name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so the release job can attach assets with the default token.
permissions:
  contents: write

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform; Linux is tested too because the
        # sysfs backend and the whole test suite are platform-independent.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Run the test suite
        run: python -m pytest -q

  build-exe:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install ".[gui]"

      - name: Build with PyInstaller (single file)
        run: pyinstaller packaging/xpshelper_onefile.spec --noconfirm

      - name: Verify the executable actually runs
        shell: pwsh
        run: |
          # One file, no folder: the release asset is the executable itself.
          $exe = ".\dist\xps-helper.exe"
          if (-not (Test-Path $exe)) { throw "Executable missing at $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("xps-helper.exe is {0:N1} MB" -f $size)

          # Exit codes matter: a frozen build that cannot import its own package
          # still produces a binary, so exercise real commands.
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "xps-helper --version failed" }

          & $exe --backend mock status
          if ($LASTEXITCODE -ne 0) { throw "status failed" }

          & $exe --backend mock --config "$env:TEMP\xh-ci.json" charge custom --start 60 --stop 80
          if ($LASTEXITCODE -ne 0) { throw "charge failed" }

          & $exe --backend mock --config "$env:TEMP\xh-ci.json" doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }

          # The privileged child is dispatched with -m, which a frozen exe has to
          # interpret itself. With no pending request it must fail cleanly rather
          # than fall through to the ordinary CLI.
          & $exe -m xpshelper.elevated_run 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "-m dispatch should fail without a request" }

          Write-Host "All executable smoke checks passed."
          # The -m probe above deliberately leaves $LASTEXITCODE non-zero, and a
          # PowerShell script exits with it unless it is cleared. Without this the
          # step fails even though every check passed.
          $global:LASTEXITCODE = 0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xps-helper-windows
          path: dist/xps-helper.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # The executable itself, not a zip: one download, no unzipping.
          files: dist/xps-helper.exe
          generate_release_notes: true
